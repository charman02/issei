<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Two families only: Fraunces (display + editorial body) and Nunito Sans
         (utility/UI). A handwritten face was tried here for a person's story and
         step remarks and cut — see tailwind.config.js. -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,600;1,9..144,700;1,9..144,900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet" />
    <title>issei</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Installable app (#89). This is not decoration: Safari on iOS grants Web Push ONLY to a
         site added to the home screen, so the manifest is the precondition for notifications
         existing at all on the platform most of these people are on.
         theme-color paints the status bar / address bar cream so the app doesn't sit inside a
         white or black band that belongs to no design. It is the app background, not `terra`:
         the accent is for things you can tap. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FBF3E2" />

    <!-- iOS ignores the manifest's icons and its display mode; these three tags are the Safari
         equivalents and are NOT redundant with the manifest.
         `apple-mobile-web-app-capable` is what makes the installed app open without Safari's
         chrome — and on iOS it is also what makes the install a "web app" rather than a
         bookmark, which is the distinction Web Push turns on. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="issei" />
    <!-- `default` keeps the ink status-bar text on our cream; `black-translucent` would push the
         content under the notch, where the app's own header already lives. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Social share / link unfurl. Static card representing the app (og.png,
         1200x630). Description is the positioning one-liner — keep it clean of
         claims the app doesn't make (see POSITIONING.md). -->
    <meta name="description" content="See what your friends are cooking, and ask for the recipe behind any of it. What arrives is the dish the way they actually make it." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="issei" />
    <meta property="og:title" content="issei — see what your friends are cooking" />
    <meta property="og:description" content="See what your friends are cooking, and ask for the recipe behind any of it. What arrives is the dish the way they actually make it." />
    <meta property="og:url" content="https://issei.app/" />
    <meta property="og:image" content="https://issei.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="issei — someone cooked you something you'd never had; this is how they send you the recipe." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="issei — see what your friends are cooking" />
    <meta name="twitter:description" content="See what your friends are cooking, and ask for the recipe behind any of it. What arrives is the dish the way they actually make it." />
    <meta name="twitter:image" content="https://issei.app/og.png" />
  </head>
  <body class="bg-cream font-sans text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
