# The daily "post something" nudge (#89).
#
# WHY A GITHUB ACTIONS CRON AND NOT AN EVENTBRIDGE RULE.
#
# Adding a scheduled construct to the CDK stack would need a manual `npx cdk deploy`, because the
# deploy pipeline never runs `cdk` at all. And that deploy has a side effect worth naming: the CDK
# task definition's Family is byte-identical to the one `deploy.yml` re-renders, so `cdk deploy`
# registers its own revision of the SAME family, built from the operator's local working tree, and
# points the live service at it. Running it merely to add a cron rule would replace the running
# production image with whatever happened to be checked out. This file needs no infrastructure
# change at all and ships with the repo.
#
# The trade is that Actions cron is unreliable about TIME, and MEASURED REALITY IS FAR WORSE THAN
# THIS COMMENT ORIGINALLY CLAIMED. It said "5-30 minutes of drift is routine". Over the first week
# of runs the GitHub API reports 39 runs in 6.5 days against a target of 24/day — 5-7 per day,
# a MEDIAN GAP OF 4.2 HOURS and a worst gap of 7.6 — so roughly three quarters of hourly ticks are
# dropped outright, and every dropped one still reports the workflow as green.
#
# `services/prompt.is_due` is what keeps that survivable: it asks "has their hour passed today, and
# have they not been sent yet?" rather than "is it exactly their hour", so a late run still catches
# everyone and `prompt_sends`' UNIQUE (user, local_date) means a manual re-run cannot double-send.
#
# BUT CATCH-UP HAS A CLOSING DOOR, and that is the part the original reasoning missed. Quiet hours
# are checked too, so the window in which a nudge can actually go out is `notify_hour` →
# `quiet_from` — four hours on the defaults (18:00 → 22:00 local). A median inter-run gap of 4.2
# hours against a 4-hour window means the window is missed about as often as it is hit. Measured
# against the real run history: 7/7 nights covered for America/New_York, but only 4/7 for
# America/Los_Angeles and 3/6 for Asia/Manila — including a night the owner reported as missing.
# The failure is an absence, so nobody finds out.
#
# HENCE EVERY 10 MINUTES rather than hourly. It does not make GitHub reliable; it buys enough
# attempts that a 4-hour window is hit even at a 75% drop rate. The endpoint is idempotent per
# (user, local_date), so the extra runs are cheap no-ops — and public repositories have unlimited
# Actions minutes, so the only cost is a curl. `tests/test_prompt.py` pins the interval against the
# default send window, because the two are only safe RELATIVE to each other.
#
# The real fix is a trigger that does not drop runs (EventBridge Scheduler at the same URL); this is
# the cheap one that needs no infrastructure change. Recorded in TECHDEBT.
#
# Swappable later without touching the app: point EventBridge at the same URL.
#
# ONE OPERATIONAL GOTCHA: GitHub DISABLES scheduled workflows on a repository with no pushes for 60
# days, and it emails the owner when it does. If notifications silently stop, check that first.

name: Daily prompt

on:
  schedule:
    # EVERY 10 MINUTES, and the frequency is doing real work — see the note above. Users are in
    # every timezone and each needs their own local hour, and the window per person is only four
    # hours wide on the defaults, against a measured median gap of 4.2 hours between runs that
    # actually happen. Offset off the top of the hour (:05, :15, …) because the top of the hour is
    # when everyone else's cron runs and GitHub's queue is measurably worse there.
    - cron: "5,15,25,35,45,55 * * * *"
  # So a run can be triggered by hand — to test the wiring, or to catch up after GitHub drops a
  # window. Safe to press twice: the UNIQUE index refuses the second send.
  workflow_dispatch:

# Never two at once. A run that overlaps its successor would have both trying to claim the same
# (user, local_date) rows — the database would refuse the duplicate, but there is no reason to make
# it work for nothing.
concurrency:
  group: daily-prompt
  cancel-in-progress: false

# Nothing here reads or writes the repo — it makes one authenticated HTTP call — so the job takes
# no GITHUB_TOKEN scope at all rather than inheriting the repository default.
permissions: {}

jobs:
  prompt:
    runs-on: ubuntu-latest
    steps:
      - name: Send the daily prompt
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_KEY: ${{ secrets.CRON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_KEY:-}" ] || [ -z "${API_URL:-}" ]; then
            echo "CRON_KEY or API_URL secret is not set — nothing to do."
            exit 0
          fi
          # --fail-with-body so a 4xx/5xx fails the step AND shows what the server said. Without
          # the body, a 404 (wrong key, or the secret unset on the server) is indistinguishable
          # from a routing problem.
          response=$(curl --silent --show-error --fail-with-body \
            --max-time 300 \
            -X POST "${API_URL}/notifications/run-daily-prompt" \
            -H "X-Issei-Cron-Key: ${CRON_KEY}")
          echo "$response"

          # WRITE IT WHERE SOMEONE WILL ACTUALLY SEE IT. The response carries a per-reason
          # breakdown of every skip (`reasons`), and it used to be buried in a step log nobody
          # opens — so when the owner asked why a nudge hadn't arrived, answering it meant the
          # GitHub API, a per-timezone window calculation and re-deriving `is_due` by hand. The
          # step summary shows on the run page itself.
          #
          # NOT a failure when nothing was sent: zero is the correct and common outcome (nobody
          # the person follows has posted). Failing on it would train everyone to ignore a red X.
          {
            echo "### Daily prompt"
            echo ""
            echo '```json'
            echo "$response"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
